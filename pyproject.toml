[project]
name = "solar-valuation"
version = "0.1.0"
description = "Stochastic valuation model for solar assets with live market data"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",          # async HTTP client for APIs
    "pandas>=2.2",
    "numpy>=1.26",
    "polars>=1.0",          # fast dataframes for large price datasets
    "scipy>=1.13",
    "pydantic>=2.7",        # data validation
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",      # local storage
    "duckdb>=1.0",          # analytical queries on price data
    "apscheduler>=3.10",    # scheduled data pulls
    "structlog>=24.1",      # structured logging
    "tenacity>=8.3",        # retry logic for API calls
    "pyarrow>=16.0",        # parquet support
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel>=6.29",
]
viz = [
    "streamlit>=1.35",
    "plotly>=5.22",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
